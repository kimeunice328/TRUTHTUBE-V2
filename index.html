<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthTube — Did You Get Clickbaited?</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:        #0a0a0a;
      --bg-elevated:    #1a1a1a;
      --bg-card:        #141414;
      --bg-input:       #131313;
      --bg-deep:        #0f0f0f;

      --border-subtle:  rgba(255,255,255,0.06);
      --border-medium:  rgba(255,255,255,0.11);
      --border-strong:  rgba(255,255,255,0.22);
      --border-card:    rgba(255,255,255,0.09);

      --text-primary:   #ffffff;
      --text-secondary: #888888;
      --text-muted:      #444444;

      --red:            #E50914;
      --red-glow-sm:    rgba(229,9,20,0.32);
      --red-glow-lg:    rgba(229,9,20,0.14);
      --red-border:     rgba(229,9,20,0.55);

      --green:          #22c55e;
      --green-bg:       rgba(34,197,94,0.10);
      --green-border:   rgba(34,197,94,0.30);

      --orange:         #f97316;
      --orange-bg:      rgba(249,115,22,0.10);
      --orange-border:  rgba(249,115,22,0.30);

      --danger:         #E50914;
      --danger-bg:      rgba(229,9,20,0.10);
      --danger-border:  rgba(229,9,20,0.30);

      --verify-bg:      var(--red);
      --verify-hover:   #ff1a26;
      --verify-text:    #ffffff;

      --badge-bg:       rgba(229,9,20,0.10);
      --badge-text:     #ff6b73;
      --badge-border:   rgba(229,9,20,0.25);

      --font-headline:  'Helvetica Neue', 'Helvetica', 'Arial', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-ui:        'Helvetica Neue', 'Helvetica', 'Arial', -apple-system, BlinkMacSystemFont, sans-serif;

      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-pill: 9999px;

      --header-h:    68px;
      --transition:  0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 16px; line-height: 1.4; letter-spacing: -0.01em;
      min-height: 100dvh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── RTL global overrides ── */
    html[dir="rtl"] body { letter-spacing: 0; }
    html[dir="rtl"] .header-right { margin-left: 0; margin-right: auto; }
    html[dir="rtl"] header { flex-direction: row-reverse; }
    html[dir="rtl"] .logo { flex-direction: row-reverse; }
    html[dir="rtl"] .lang-dropdown { right: auto; left: 0; }
    html[dir="rtl"] .hero-headline .line-thin,
    html[dir="rtl"] .hero-headline .line-heavy { text-align: right; }
    html[dir="rtl"] .hero-eyebrow { flex-direction: row-reverse; }
    html[dir="rtl"] .stats-strip { direction: rtl; }
    html[dir="rtl"] .input-wrap .clear-btn { right: auto; left: 18px; }
    html[dir="rtl"] .url-input { padding: 0 26px 0 64px; text-align: right; }
    html[dir="rtl"] .loading-step { flex-direction: row-reverse; }
    html[dir="rtl"] .step-text { text-align: right; }

    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border-subtle) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, transparent 35%, var(--bg-base) 100%);
      pointer-events: none; z-index: 0;
    }

    /* ══ HEADER ══════════════════════════════════════════════════════ */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h); z-index: 100;
      display: flex; align-items: center; padding: 0 32px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(10,10,10,0.84);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }

    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .logo-icon {
      width: 38px; height: 27px; border-radius: 6px; background: var(--red);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: box-shadow var(--transition);
    }
    .logo:hover .logo-icon { box-shadow: 0 0 20px rgba(229,9,20,0.55); }
    .logo-icon svg { width: 11px; height: 11px; fill: #ffffff; margin-left: 1px; }
    html[dir="rtl"] .logo-icon svg { margin-left: 0; margin-right: 1px; }
    .logo-wordmark {
      font-family: 'Calibri', 'Segoe UI', -apple-system, sans-serif;
      font-weight: 700; font-size: 15.5px; letter-spacing: 0.13em;
      text-transform: uppercase; line-height: 1; display: flex; align-items: baseline;
    }
    .logo-truth { color: #ffffff; }
    .logo-tube  { color: #7a7a7a; }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

    .beta-badge {
      display: inline-flex; align-items: center; padding: 3px 10px;
      border-radius: var(--radius-pill); background: var(--badge-bg); border: 1px solid var(--badge-border);
      font-family: var(--font-ui); font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.10em; text-transform: uppercase; color: var(--badge-text); user-select: none;
    }

    .lang-wrapper { position: relative; display: flex; align-items: center; }
    .lang-btn {
      display: flex; align-items: center; gap: 7px; padding: 8px 14px;
      border-radius: var(--radius-md); border: 1px solid var(--border-medium);
      background: var(--bg-elevated); color: var(--text-primary);
      font-family: var(--font-ui); font-size: 13px; font-weight: 400; letter-spacing: -0.01em;
      cursor: pointer; transition: border-color var(--transition), background var(--transition);
      appearance: none; -webkit-appearance: none; white-space: nowrap;
    }
    .lang-btn:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.06); }
    .lang-flag { font-size: 16px; line-height: 1; }
    .lang-caret { margin-left: 2px; opacity: 0.45; transition: transform var(--transition); }
    
    .lang-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0; min-width: 240px;
      background: var(--bg-elevated); border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg); padding: 6px; z-index: 200;
      box-shadow: 0 24px 48px rgba(0,0,0,0.65);
      display: none; max-height: 360px; overflow-y: auto;
    }
    .lang-dropdown.open { display: block; animation: dropIn 0.16s ease; }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .lang-option {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: var(--radius-md); cursor: pointer;
      font-family: var(--font-ui); font-size: 13px; color: var(--text-secondary);
      transition: background var(--transition), color var(--transition);
    }
    .lang-option:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .lang-option.active { color: var(--text-primary); background: rgba(255,255,255,0.04); }
    .lang-option .flag { font-size: 17px; line-height: 1; }
    .lang-option .lang-name { flex: 1; }
    .lang-option .lang-native { font-size: 11.5px; color: var(--text-muted); }

    /* ══ VIEWS ═══════════════════════════════════════════════════════ */
    .view {
      position: relative; z-index: 1; min-height: 100dvh;
      display: none; flex-direction: column;
      align-items: flex-start; justify-content: center;
      padding: calc(var(--header-h) + 48px) 48px 80px;
      max-width: 1100px; margin: 0 auto; width: 100%;
    }
    .view.active { display: flex; }

    /* ══ VIEW 1 — HOME ═══════════════════════════════════════════════ */
    .hero { width: 100%; margin-bottom: 48px; }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px;
      font-size: 11.5px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary);
    }
    .hero-eyebrow-dot {
      width: 14px; height: 14px; border-radius: 50%; background: var(--red);
      display: flex; align-items: center; justify-content: center;
    }
    .hero-eyebrow-dot::after { content: ''; display: block; width: 6px; height: 6px; border-radius: 50%; background: #ffffff; }
    .hero-headline {
      font-family: var(--font-headline); font-size: clamp(3.2rem, 8vw, 5.5rem);
      line-height: 0.96; letter-spacing: -0.02em; text-transform: uppercase; color: #ffffff; margin-bottom: 0;
    }
    .hero-headline .line-thin  { display: block; font-weight: 400; letter-spacing: -0.01em; }
    .hero-headline .line-heavy { display: block; font-weight: 800; letter-spacing: -0.03em; }

    .stats-strip {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px; width: 100%; max-width: 680px;
      background: var(--border-card); border: 1px solid var(--border-card);
      border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 48px;
    }
    .stat-card { background: var(--bg-card); padding: 22px 24px 20px; display: flex; flex-direction: column; gap: 6px; }
    .stat-value { font-family: var(--font-headline); font-weight: 700; font-size: 2.2rem; line-height: 1; color: #ffffff; }
    .stat-label { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary); }

    .search-section { width: 100%; max-width: 680px; }
    .input-wrap { position: relative; width: 100%; margin-bottom: 14px; }
    .url-input {
      width: 100%; height: 72px; padding: 0 64px 0 26px;
      border-radius: var(--radius-xl); border: 1.5px solid var(--border-medium);
      background: var(--bg-input); color: var(--text-primary);
      font-size: 15px; outline: none; transition: border-color var(--transition);
    }
    .url-input:focus { border-color: var(--red-border); }
    
    .verify-btn {
      width: 100%; height: 66px; border-radius: var(--radius-xl); border: none;
      background: var(--verify-bg); color: var(--verify-text);
      font-size: 15px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 24px rgba(229,9,20,0.35); transition: background var(--transition);
    }
    .verify-btn:hover { background: var(--verify-hover); }

    /* ══ PRICING SECTION ═════════════════════════════════════════════ */
    .pricing-section { width: 100%; max-width: 680px; margin-top: 60px; }
    .pricing-eyebrow { display: flex; align-items: center; gap: 18px; margin-bottom: 32px; }
    .pricing-eyebrow-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border-medium), transparent); }
    .pricing-eyebrow-text { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-secondary); }
    
    .pricing-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      border: 1px solid var(--border-card); border-radius: 20px; overflow: hidden;
    }
    .plan-card {
      background: #0d0d0d; padding: 36px 24px 30px; display: flex; flex-direction: column;
      position: relative; transition: background var(--transition);
    }
    .plan-card + .plan-card { border-left: 1px solid var(--border-card); }
    .plan-card:hover { background: #111111; }
    .plan-card.featured { background: #111111; z-index: 1; }
    .plan-card.featured::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--red);
    }

    .plan-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; padding: 4px 11px;
      border-radius: var(--radius-pill); border: 1px solid; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    }
    .plan-badge.badge-free { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08); color: #888888; }
    .plan-badge.badge-standard { background: rgba(229,9,20,0.07); border-color: rgba(229,9,20,0.22); color: #ff6b73; }
    .plan-badge.badge-pro { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.11); color: #aaaaaa; }

    .plan-name { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .plan-desc { font-size: 12.5px; color: #666666; margin-bottom: 24px; min-height: 38px; line-height: 1.5; }
    
    .plan-price-block { display: flex; align-items: baseline; gap: 2px; padding: 16px 0; margin-bottom: 20px; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); }
    .plan-currency { font-size: 15px; color: var(--text-secondary); align-self: flex-start; padding-top: 4px; }
    .plan-price-num { font-size: 2.5rem; font-weight: 700; color: var(--text-primary); line-height: 1; }
    .plan-period { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-left: 4px; }

    .plan-features { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; flex: 1; }
    .plan-feature { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #b0b0b0; }
    .plan-feature.dimmed { color: #3a3a3a; }
    .feature-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); }
    .plan-feature.dimmed .feature-dot { background: #333333; }

    .plan-cta {
      width: 100%; padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid;
      font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      text-align: center; text-decoration: none; cursor: pointer; transition: all var(--transition);
    }
    .cta-ghost { background: transparent; border-color: rgba(255,255,255,0.1); color: #666666; }
    .cta-ghost:hover { background: rgba(255,255,255,0.03); color: var(--text-primary); }
    .cta-featured { background: var(--red); border-color: var(--red); color: #ffffff; }
    .cta-featured:hover { background: #ff1a26; }
    .cta-outline { background: transparent; border-color: rgba(255,255,255,0.15); color: var(--text-secondary); }
    .cta-outline:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }

    @media (max-width: 720px) {
      .pricing-grid { grid-template-columns: 1fr; }
      .plan-card + .plan-card { border-left: none; border-top: 1px solid var(--border-card); }
    }
  </style>
</head>

        placeholder: "Cole o URL do vídeo do YouTube aqui...",
        btnVerify: "Analisar Estrutura do Vídeo",
        pricingTitle: "Níveis de Acesso ao Sistema",
        plans: [

    // 현재 선택된 기본 언어 (영어)
    let currentLang = 'en';

    // 17개국 드롭다운 메뉴 열기/닫기
    function toggleLangDropdown() {
      document.getElementById('langDropdown').classList.toggle('open');
    }

    // 전 세계 언어 리스트 초기 조립 렌더링
    function initLangDropdown() {
      const dropdown = document.getElementById('langDropdown');
      dropdown.innerHTML = '';
      
      Object.keys(i18nMatrix).forEach(langKey => {
        const item = i18nMatrix[langKey];
        const opt = document.createElement('div');
        opt.className = `lang-option ${langKey === currentLang ? 'active' : ''}`;
        opt.onclick = () => selectLanguage(langKey);
        
        opt.innerHTML = `
          <span class="flag">${item.flag}</span>
          <span class="lang-name">${item.name}</span>
          <span class="lang-native">${item.native}</span>
        `;
        dropdown.appendChild(opt);
      });
    }

    // 언어 선택 시 화면 전체의 텍스트가 마법처럼 갱신되는 핵심 로직
    function selectLanguage(langKey) {
      currentLang = langKey;
      const data = i18nMatrix[langKey];
      
      // 1. 헤더 내 국가 플래그 및 텍스트 전환
      document.getElementById('currentFlag').innerText = data.flag;
      document.getElementById('currentLangName').innerText = data.name;
      
      // 2. RTL(아랍어 등) 및 LTR 구조 자동 스위칭
      if(langKey === 'ar') {
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'ar';
      } else {
        document.documentElement.setAttribute('dir', 'ltr');
        document.documentElement.lang = langKey;
      }
      
      // 3. 메인 히어로 영역 번역 맵핑
      document.getElementById('txtEyebrow').innerText = data.eyebrow;
      document.getElementById('txtHeadline1').innerText = data.headline1;
      document.getElementById('txtHeadline2').innerText = data.headline2;
      
      // 4. 통계 카테고리 라벨 번역
      document.getElementById('lblStatLang').innerText = data.statLang;
      document.getElementById('lblStatAcc').innerText = data.statAcc;
      document.getElementById('lblStatSpeed').innerText = data.statSpeed;
      
      // 5. 입력창 및 검색 버튼
      document.getElementById('urlInput').placeholder = data.placeholder;
      document.getElementById('btnVerify').innerText = data.btnVerify;
      document.getElementById('lblPricingTitle').innerText = data.pricingTitle;
      
      // 6. 대표님이 가장 기대하신 3단 요금제 다국어 카드 렌더링 시작
      renderPricingCards(data.plans);
      
      // 드롭다운 닫기
      document.getElementById('langDropdown').classList.remove('open');
      
      // 액티브 클래스 리프레시
      initLangDropdown();
    }

    // 요금제 카드를 세련된 블랙 UI로 자동 배치하는 함수
    function renderPricingCards(plans) {
      const grid = document.getElementById('pricingGrid');
      grid.innerHTML = '';
      
      plans.forEach(plan => {
        const card = document.createElement('div');
        card.className = `plan-card ${plan.style === 'featured' ? 'featured' : ''}`;
        
        // 가격 소수점 분할 처리 (.99 처리용)
        let decimalSpan = '';
        if(plan.decimal) {
          decimalSpan = `<span class="plan-price-decimal">${plan.decimal}</span>`;
        }
        
        // 기능 리스트(Features) 조립
        let featureListHtml = '';
        plan.features.forEach(feat => {
          featureListHtml += `
            <li class="plan-feature">
              <div class="feature-dot"></div>
              <div>${feat}</div>
            </li>
          `;
        });
        
        // 카드 내부에 최종 HTML 조립 배포
        card.innerHTML = `
          <div class="plan-badge badge-${plan.style}">
            <div class="plan-badge-dot"></div>
            <span>${plan.badge}</span>
          </div>
          <h3 class="plan-name">${plan.name}</h3>
          <p class="plan-desc">${plan.desc}</p>
          
          <div class="plan-price-block">
            <span class="plan-currency">$</span>
            <span class="plan-price-num">${plan.price}</span>
            ${decimalSpan}
            <span class="plan-period">${plan.period}</span>
          </div>
          
          <ul class="plan-features">
            ${featureListHtml}
          </ul>
          
          <button class="plan-cta cta-${plan.style}">${plan.cta}</button>
        `;
        
        grid.appendChild(card);
      });
    }

    // 도큐먼트 로드 시 즉시 기본 언어 세팅
    document.addEventListener("DOMContentLoaded", () => {
      initLangDropdown();
      selectLanguage('en'); // 초기 기본화면은 영어로 출력
    });

    // 외부 클릭 시 언어 드롭다운 자동으로 닫히는 센스있는 기능
    window.addEventListener('click', function(e) {
      if (!document.getElementById('langBtn').contains(e.target)){
        document.getElementById('langDropdown').classList.remove('open');
      }
    });

    // 영상 구조 분석 더미 함수 (확인용)
    function startAnalysis() {
      const url = document.getElementById('urlInput').value;
      if(!url) {
        alert(currentLang === 'ko' ? '유튜브 링크를 입력해 주세요!' : 'Please paste a valid YouTube URL!');
        return;
      }
      alert(currentLang === 'ko' ? '인공지능 분석 시뮬레이션을 가동합니다.' : 'Simulating advanced AI infrastructure core verification...');
    }
  </script>
